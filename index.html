(function(root){
const agents=[{id:'NEXO',role:'Orquestração',symbol:'✦',color:'#62e6ff',skills:['Contexto','Planeamento','Síntese']},{id:'ATLAS',role:'Estratégia & coordenação',symbol:'◈',color:'#7aa2ff',skills:['Objetivos','Prioridades','Coordenação']},{id:'NOVA',role:'Pesquisa & inteligência',symbol:'✧',color:'#c79bff',skills:['Pesquisa fictícia','Síntese','Comparação']},{id:'FORGE',role:'Engenharia & execução',symbol:'⌘',color:'#ffb578',skills:['Prototipagem','Revisão de UI','Documentação']},{id:'SENTINEL',role:'Qualidade & segurança',symbol:'⬡',color:'#72e4b3',skills:['Checklist','Revisão simulada','Consistência']},{id:'IMMO',role:'Pesquisa de alojamento',symbol:'⌂',color:'#f1c878',skills:['Critérios fictícios','Comparação','Resumo']},{id:'LYRA',role:'Conteúdo & comunicação',symbol:'✺',color:'#f59fce',skills:['Rascunhos','Tom de voz','Ideação']}];
const clone=v=>JSON.parse(JSON.stringify(v));

function missionPage(){let ms=state.missions.filter(m=>filter==='all'||M.status(m)===filter);let m=ms.find(m=>m.id===selectedMission)||ms[0];if(m)selectedMission=m.id;return `<div class="tabs" aria-label="Filtrar missões">${[['all','Todas'],...Object.entries(labels)].map(([k,v])=>`<button data-filter="${k}" aria-pressed="${filter===k}">${v}</button>`).join('')}</div><div class="mobile-mission-picker"><label for="mission-picker">Missão em foco</label><select id="mission-picker">${ms.length?ms.map(n=>`<option value="${esc(n.id)}" ${n.id===m?.id?'selected':''}>${esc(n.title)} · ${labels[M.status(n)]}</option>`).join(''):'<option>Nenhuma missão neste filtro</option>'}</select></div><div class="mission-layout"><div class="mission-list">${ms.map(n=>`<div class="${n.id===m?.id?'selected-wrapper':''}">${missionSummary(n)}</div>`).join('')||'<div class="panel empty">Não há missões neste estado.</div>'}</div>${m?`<section class="panel mission-detail"><div class="section-head"><span class="eyebrow">MISSION / ${esc(m.agent)}</span>${badge(M.status(m))}</div><h2>${esc(m.title)}</h2><div class="progress-row"><progress aria-label="Progresso global da missão" value="${M.progress(m)}" max="100"></progress><b>${M.progress(m)}%</b></div><div class="phase-track" aria-label="Fases da missão">${m.tasks.map((t,i)=>`<div class="phase phase-${t.status}"><span>${t.status==='done'?'✓':String(i+1).padStart(2,'0')}</span><b>${esc(t.phase)}</b><small>${labels[t.status]}</small></div>`).join('')}</div><p class="subtle">${m.tasks.filter(t=>t.status==='done').length} de ${m.tasks.length} tarefas concluídas · Prioridade ${esc(m.priority||'Normal')}</p>${m.tasks.map((t,i)=>{const ready=t.deps.every(d=>m.tasks[d].status==='done');return `<div class="task task-${t.status}"><div class="row"><span class="number">${t.status==='done'?'✓':i+1}</span><div><span class="eyebrow">${esc(t.phase)}</span><h3>${esc(t.title)}</h3></div>${badge(t.status)}</div><p>Responsável: ${esc(t.agent)} · ${t.deps.length?'Depende da tarefa '+t.deps.map(d=>(d+1)+' — '+(m.tasks[d].status==='done'?'concluída':'por concluir')).join(', '):'Sem dependências'}</p><div class="actions">${t.status==='pending'?`<button class="primary" data-task="${i}" data-next="running" ${ready?'':'disabled'}>${ready?'Iniciar simulação':'Aguarda dependência'}</button>`:t.status==='running'?`<button class="primary" data-task="${i}" data-next="done">${t.agent==='SENTINEL'?'Aprovar revisão simulada':'Concluir tarefa demo'}</button><button data-task="${i}" data-next="blocked">Bloquear</button><button data-task="${i}" data-next="failed">Simular falha</button>`:['blocked','failed'].includes(t.status)?`<button data-task="${i}" data-next="pending">${t.status==='blocked'?'Desbloquear':'Tentar novamente'}</button>`:'<span class="subtle">Resultado demonstrativo registado ✓</span>'}</div></div>`}).join('')}${M.status(m)==='done'?`<div class="result"><h3>✓ Resultado demonstrativo disponível</h3><p>Objetivo: ${esc(m.title)}. As três fases foram marcadas como concluídas nesta simulação. Revisão SENTINEL: checklist de objetivo, resultado e dependências aprovado manualmente na demo.</p><button data-result style="margin-top:12px">Descarregar resumo</button></div>`:''}<h3 style="margin-top:25px">Timeline de execução</h3>${m.events.slice(0,8).map(eventHTML).join('')}</section>`:'<section class="panel empty"><h2>Espaço para o próximo objetivo</h2><p>Cria uma missão ou escolhe outro filtro.</p><button data-new class="primary">＋ Nova missão</button></section>'}</div>`}
function chatPage(){const a=agent(state.activeAgent),messages=state.messages.filter(m=>(m.agent||'NEXO')===a.id);return `<div class="chat-layout"><section class="panel chat-agents"><h2>Conversas</h2>${agents.map(a=>`<button data-chat-agent="${a.id}" aria-pressed="${state.activeAgent===a.id}">${avatar(a.id)}<span>${a.id}</span></button>`).join('')}</section><section class="panel chat-panel"><div class="section-head"><div class="row">${avatar(a.id)}<div><b>${a.id}</b><div class="subtle">${esc(a.role)}</div></div></div><div class="voice-chat-action"><span class="tag">SIMULAÇÃO</span><button type="button" data-voice-open class="voice-chat-button">🎙 Chamada de voz</button></div></div><div class="chat" role="log" aria-label="Histórico da conversa" aria-live="polite">${messages.length?messages.map(m=>`<div class="message ${m.role}">${m.role==='assistant'?avatar(m.agent||'NEXO'):''}<small>${m.role==='user'?'TU':esc(m.agent||'NEXO')} · DEMO</small><span class="message-body">${esc(m.text)}</span>${m.status&&m.status!=='complete'?`<span class="subtle message-state">${m.status==='streaming'?'A receber…':m.status==='cancelled'?'Resposta cancelada · parcial':'Resposta interrompida'}</span>`:''}</div>`).join(''):`<div class="chat-empty">${avatar(a.id)}<h2>O que vamos explorar?</h2><p>Experimenta conversar com ${a.id}. As respostas são cenários locais predefinidos, sem ligação a um modelo de IA.</p><div class="actions" style="justify-content:center"><button data-prompt="Resume o workspace">Resumo do workspace</button><button data-prompt="Ajuda-me a planear uma missão">Planear uma missão</button></div></div>`}${busy?`<div class="typing" role="status">${esc(a.id)} está a preparar uma resposta simulada ···</div>`:''}</div>${chatError?`<div class="error" role="alert">${esc(chatError)} <button id="retry-chat">Tentar novamente</button></div>`:''}<form id="chat" class="composer"><label for="prompt" class="subtle">Mensagem para ${a.id}</label><textarea id="prompt" name="text" rows="2" enterkeyhint="send" maxlength="2000" required placeholder="Escreve a tua ideia…" >${esc(chatDraft)}</textarea><div class="row"><span class="muted">Respostas fictícias · Sem ações externas</span><button class="primary" ${busy?'disabled':''}>Enviar ↗</button></div></form><div class="row" style="margin-top:10px"><span class="subtle">${messages.length} mensagens nesta conversa</span><button id="simulate-chat-error" class="subtle" ${busy?'disabled':''}>${failNext?'Falha preparada para a próxima mensagem':'Testar erro simulado'}</button></div></section></div>`}

function memory(){return `<div class="two"><section class="panel"><div class="section-head"><h2>Contexto que permanece</h2><span class="tag">LOCAL</span></div><p class="subtle">Mantém notas da demonstração, decisões de design e próximos passos.</p><form id="memory"><label>Memória do workspace<textarea name="notes" maxlength="20000" style="min-height:300px">${esc(state.notes)}</textarea></label><div class="row"><button class="primary">Guardar memória</button><span class="subtle">Até 20 000 caracteres</span></div></form></section><section class="panel"><span class="eyebrow">WORKSPACE KNOWLEDGE</span><h2 style="margin-top:16px">Uma fonte de contexto.</h2><div class="item"><h3>01 / Identidade</h3><p>Dark navy, ciano e roxo. Clareza acima do ruído.</p></div><div class="item"><h3>02 / Privacidade</h3><p>Utiliza apenas dados fictícios. Não existe sincronização externa.</p></div><div class="item"><h3>03 / Continuidade</h3><p>Exporta a demonstração em Settings para manter uma cópia.</p></div></section></div>`}
function automations(){return `<section class="panel"><div class="section-head"><h2>Rotinas com intenção</h2><span class="tag">NÃO EXECUTAM TAREFAS</span></div><p>Configura a aparência do teu cenário. Estas rotinas não são agendadas nem executadas.</p>${[['Briefing diário','Todos os dias · 09:00','ATLAS'],['Revisão semanal','Sexta-feira · 16:00','SENTINEL'],['Resumo de missões','Todos os dias · 18:00','NEXO']].map((a,i)=>`<div class="item row"><div class="row">${avatar(a[2])}<div><h3>${a[0]}</h3><span class="subtle">${a[1]} · ${a[2]}</span></div></div><button role="switch" aria-checked="${state.auto[i]}" aria-label="${a[0]}" data-auto="${i}">${state.auto[i]?'● Ativa na demo':'○ Pausada'}</button></div>`).join('')}</section>`}
function settings(){return `<div class="two"><section class="panel"><h2>O teu ambiente</h2><div class="item row"><span>Versão</span><b>0.7 · Backend Bridge</b></div><div class="item row"><span>Serviços reais</span><span class="badge">NENHUM LIGADO</span></div><div class="item"><h3>Aplicação e modo offline</h3><p class="subtle" id="pwa-status">${location.protocol==='file:'?'Modo ficheiro: navegação disponível. Instalação e cache offline requerem localhost ou HTTPS.':'A verificar suporte local da PWA…'}</p><button id="install" ${installPrompt?'':'disabled'}>Instalar aplicação</button><p class="subtle">Se o navegador não mostrar instalação, utiliza o menu do navegador. Não foi verificado num dispositivo Android físico.</p></div><div class="item"><h3>Acessibilidade</h3><p class="subtle">Navegação por teclado, foco visível e respeito pela preferência do sistema para movimento reduzido.</p></div></section><section class="panel"><h2>Dados da demonstração</h2><p class="subtle">O formato e a chave de dados são compatíveis com a v0.4. Na mesma origem, ambas partilham o workspace; noutra origem, usa exportação e importação JSON.</p><div class="actions"><button id="export">Exportar dados JSON</button><button id="import">Importar dados JSON</button><input id="import-file" type="file" accept="application/json,.json" hidden></div><div class="item"><h3>Recomeçar</h3><p class="subtle">Repõe apenas os dados deste workspace local. Exporta uma cópia antes de repor; na mesma origem os dados são partilhados com a v0.4.</p><button id="reset">Repor demonstração</button></div></section></div>`}

const primaryPages=['Dashboard','NEXO Chat','Agentes','Mission Control','COMMS'];

function currentPage(){try{const p=decodeURIComponent(location.hash.slice(1)||'Dashboard');return pages.includes(p)?p:'Dashboard'}catch{return 'Dashboard'}}

function reply(text,id){if(/resum|estado|workspace/i.test(text))return `Resumo demonstrativo do workspace\n\n• ${state.missions.length} missões registadas\n• ${state.missions.filter(m=>M.status(m)==='done').length} concluídas\n• ${state.missions.filter(m=>['blocked','failed'].includes(M.status(m))).length} precisam de atenção\n\nPróximo passo: abre Mission Control e verifica as dependências. Estes números refletem apenas os dados locais.`;return `Plano demonstrativo de ${id}\n\n1. Define um objetivo claro e um critério de sucesso.\n2. Prepara o resultado fictício com ${id}.\n3. Conclui a revisão simulada com SENTINEL.\n\nEste é um exemplo predefinido para explorar a interface. Nenhuma ferramenta foi executada. Podes criar a missão em Mission Control.`}
function legacySendChat(text,retry=false){if(busy)return;const id=state.activeAgent;if(!retry)state.messages.push({role:'user',text,agent:id});busy=true;chatError='';chatDraft='';save();const wasFocused=document.activeElement?.id==='prompt';render();if(wasFocused)$('#prompt')?.focus();setTimeout(()=>{busy=false;if(failNext){failNext=false;chatError='Falha simulada de resposta. A tua mensagem está guardada; podes tentar novamente.';}else{state.messages.push({role:'assistant',agent:id,text:reply(text,id)});save()}if(currentPage()==='NEXO Chat'){const restoreFocus=document.activeElement?.id==='prompt';render();if(restoreFocus)$('#prompt')?.focus();if($('.chat'))$('.chat').scrollTop=$('.chat').scrollHeight;}else{toast('Resposta simulada preparada no chat.');}},850)}

function bind(){if($('#mission-picker'))$('#mission-picker').onchange=e=>{selectedMission=e.target.value;render()};document.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>newMission(b.dataset.new||'ATLAS'));document.querySelectorAll('[data-mission]').forEach(b=>b.onclick=()=>{selectedMission=b.dataset.mission;if(currentPage()==='Mission Control')render();else{filter='all';location.hash='Mission Control'}});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-task]').forEach(b=>b.onclick=async()=>{const m=state.missions.find(m=>m.id===selectedMission);if(services){const r=await window.NexoFoundation.command('missions.transition',{id:m.id,taskIndex:Number(b.dataset.task),next:b.dataset.next,expectedRevision:m.revision||0,requestId:services.newRequestId()},b);if(r){notify(r.events[0].text);save();if(currentPage()==='Mission Control'&&b.isConnected)render()}return}if(M.transition(m,Number(b.dataset.task),b.dataset.next)){notify(m.events[0].text);feedback();render()}else toast('Esta tarefa ainda não pode avançar.')});document.querySelectorAll('[data-agent-detail]').forEach(b=>b.onclick=()=>{const a=agent(b.dataset.agentDetail);modal(a.id+' / '+a.role,`${avatar(a.id)}<p>Papel demonstrativo: ${esc(a.skills.join(', '))}.</p><p class="subtle">Sem acesso a ferramentas ou serviços reais. O histórico e as capacidades apresentados são fictícios.</p><button id="open-agent-chat" class="primary">Conversar com ${a.id}</button>`);$('#open-agent-chat').onclick=()=>{state.activeAgent=a.id;save();$('#modal').close();location.hash='NEXO Chat'}});document.querySelectorAll('[data-chat-agent]').forEach(b=>b.onclick=()=>{if(busy){toast('Aguarda a resposta simulada.');return}state.activeAgent=b.dataset.chatAgent;chatDraft='';chatError='';save();if(currentPage()==='NEXO Chat')render();else location.hash='NEXO Chat'});document.querySelectorAll('[data-auto]').forEach(b=>b.onclick=()=>{state.auto[b.datase
