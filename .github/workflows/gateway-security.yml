name: Gateway security checks
on:
  pull_request:
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway-security.yml'
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test simulated providers and HTTP boundary
        working-directory: gateway
        run: node --test github-gateway.test.mjs http-smoke.test.mjs online-server.test.mjs
      - name: Build gateway image without secrets
        run: docker build -t nexo-gateway-check gateway
